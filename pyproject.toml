[project]
name = "armor-eval"
version = "0.1.0"
description = "Adversarial benchmarking framework for AI agents with Armor security integration"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80 -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: requires a live external service (Ollama, llama-cpp model, Docker)",
]

[tool.coverage.run]
# __main__.py is the CLI entry point; covered by subprocess tests that don't report to pytest-cov.
omit = ["src/__main__.py"]
